analyzer:
  exclude:
    - build/**
    - windows/**
    # 独立探针有自己的依赖与分析配置，不属于 App 包。
    - tool/probes/sqlcipher/**
linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - use_build_context_synchronously
    - prefer_const_constructors
    - unnecessary_this
    - valid_regexps
